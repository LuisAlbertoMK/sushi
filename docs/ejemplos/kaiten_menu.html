<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>廻る寿司 · Menú Kaiten</title>
<style>
  :root{
    --bg:#12151a;
    --bg-2:#1a1e25;
    --wood-1:#4a3222;
    --wood-2:#6b4a30;
    --wood-3:#2e2015;
    --red:#b7302c;
    --gold:#c9a15a;
    --cream:#efe4cf;
    --ink:#ece5d6;
    --muted:#9aa0ab;
    --tier-green:#4f7c6b;
    --tier-yellow:#c9962f;
    --tier-red:#b7302c;
    --tier-silver:#8892a6;
    --tier-gold-bg:#1c1a16;
    --font-display: Georgia, 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --belt-duration: 18s;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse at 50% -10%, #23283060 0%, transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 16px 0;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001s !important; transition-duration:0.001s !important;}
  }

  /* ---------- Header ---------- */
  header{ text-align:center; margin-bottom:6px; max-width:560px; }
  .seal{
    display:inline-flex; align-items:center; justify-content:center;
    width:46px; height:46px; border-radius:50%;
    background:var(--red);
    border:2px solid #7d1e1b;
    font-family:var(--font-display);
    font-size:22px; color:var(--cream);
    box-shadow:0 2px 6px rgba(0,0,0,.4);
    margin-bottom:8px;
  }
  h1{
    font-family:var(--font-display);
    font-weight:700;
    font-size:clamp(24px,5vw,34px);
    letter-spacing:.04em;
    margin:0 0 4px;
    color:var(--cream);
  }
  header p{
    margin:0; color:var(--muted); font-size:13.5px; letter-spacing:.02em;
  }

  .view{ width:100%; max-width:560px; display:flex; flex-direction:column; align-items:center;
    transition: opacity .3s ease, transform .3s ease; }
  .view[hidden]{ display:none; }
  .view.enter{ opacity:0; transform:translateY(10px); }

  /* ---------- Wheel (turntable) ---------- */
  .wheel-wrap{
    position:relative;
    width:clamp(280px,86vw,520px);
    aspect-ratio: 5 / 3.05;
    margin:18px 0 4px;
    outline:none;
    cursor:grab;
    touch-action:none;
    -webkit-user-select:none; user-select:none;
  }
  .wheel-wrap:active{ cursor:grabbing; }
  .wheel-wrap:focus-visible .wheel-disc{
    box-shadow:0 0 0 3px var(--gold), 0 14px 30px rgba(0,0,0,.55), inset 0 0 40px rgba(0,0,0,.5);
  }
  .wheel-disc{
    position:absolute; inset:0; border-radius:50%;
    background:
      repeating-radial-gradient(circle at 50% 50%, rgba(0,0,0,.08) 0px, rgba(0,0,0,.08) 2px, transparent 2px, transparent 10px),
      radial-gradient(circle at 38% 32%, var(--wood-2), var(--wood-1) 55%, var(--wood-3) 100%);
    border:6px solid var(--gold);
    box-shadow:0 14px 30px rgba(0,0,0,.55), inset 0 0 40px rgba(0,0,0,.5);
  }
  .wheel-hub{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    pointer-events:none; z-index:50;
  }
  .hub-kanji{
    font-family:var(--font-display); font-size:clamp(26px,5.5vw,38px);
    color:var(--gold); line-height:1;
  }
  .hub-text{
    font-size:11px; color:var(--cream); opacity:.75; margin-top:6px;
    letter-spacing:.03em;
  }
  .category-plate{
    position:absolute; top:0; left:0;
    width:clamp(64px,15vw,82px); height:clamp(64px,15vw,82px);
    border-radius:50%;
    border:2px solid var(--gold);
    background:radial-gradient(circle at 35% 30%, #2a2f38, #171a1f 70%);
    color:var(--cream);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:var(--font-body); font-size:11px; font-weight:600;
    gap:2px; cursor:pointer;
    box-shadow:0 6px 12px rgba(0,0,0,.5);
    will-change:transform;
  }
  .category-plate .emoji{ font-size:20px; }
  .category-plate:focus-visible{ box-shadow:0 0 0 3px var(--gold); }

  .wheel-controls{
    display:flex; align-items:center; gap:18px; flex-wrap:wrap;
    justify-content:center; margin:14px 0 22px;
  }
  .icon-btn{
    background:var(--bg-2); color:var(--cream); border:1px solid #333a44;
    padding:8px 14px; border-radius:999px; font-size:13px; cursor:pointer;
    font-family:var(--font-body);
  }
  .icon-btn:hover{ border-color:var(--gold); }
  .speed-label{ font-size:12.5px; color:var(--muted); display:flex; align-items:center; gap:8px; }
  .speed-label input{ accent-color:var(--gold); }
  .speed-tag{ font-size:10.5px; opacity:.65; }
  .category-plate:hover{ filter:brightness(1.18); }
  .belt-track-wrap::after{
    content:"pasa el cursor para pausar"; display:block; text-align:center;
    font-size:10.5px; color:var(--muted); margin-top:8px; opacity:.7;
  }

  /* ---------- Belt view ---------- */
  .belt-header{
    width:100%; display:flex; align-items:center; gap:14px;
    margin:18px 0 14px;
  }
  .belt-header h2{
    font-family:var(--font-display); font-size:20px; margin:0; color:var(--cream);
  }
  .belt-track-wrap{
    width:100%; overflow:hidden; border-radius:16px;
    background:
      repeating-linear-gradient(180deg, #23262c 0px, #23262c 2px, #1b1e23 2px, #1b1e23 4px);
    border:1px solid #30343c;
    padding:22px 0;
    box-shadow:inset 0 3px 10px rgba(0,0,0,.5);
  }
  .belt-track{
    display:flex; width:max-content;
    animation: beltScroll var(--belt-duration) linear infinite;
    animation-play-state: running;
  }
  @keyframes beltScroll{ from{ transform:translateX(0);} to{ transform:translateX(-50%);} }

  .belt-item{
    display:flex; flex-direction:column; align-items:center; gap:8px;
    width:118px; flex:0 0 auto; padding:0 10px; cursor:pointer;
    background:none; border:none; color:inherit; font-family:inherit;
  }
  .plate-circle{
    width:64px; height:64px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:26px;
    box-shadow:0 4px 10px rgba(0,0,0,.4), inset 0 0 0 2px rgba(255,255,255,.15);
    transition: transform .18s ease;
  }
  .belt-item:hover .plate-circle, .belt-item:focus-visible .plate-circle{ transform:translateY(-4px) scale(1.06); }
  .belt-item.taken .plate-circle{ animation: pulseTaken .5s ease; }
  @keyframes pulseTaken{
    0%{ transform:scale(1); }
    40%{ transform:scale(1.25); box-shadow:0 0 0 6px rgba(201,161,90,.35); }
    100%{ transform:scale(1); }
  }
  .item-label{ text-align:center; line-height:1.25; }
  .item-name{ font-size:12px; color:var(--ink); }
  .item-price{ font-size:12.5px; font-weight:700; color:var(--gold); }

  /* ---------- Tray ---------- */
  .tray{
    width:100%; max-width:560px; margin:22px 0 24px;
    background:var(--bg-2); border:1px solid #30343c; border-radius:14px;
    position:sticky; bottom:12px; overflow:hidden;
  }
  .tray-summary{
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 16px; cursor:pointer; font-size:14px; font-weight:600;
  }
  .tray-summary .hint{ font-size:11px; color:var(--muted); font-weight:400; }
  .tray-details{ border-top:1px solid #30343c; padding:10px 16px 14px; }
  .tray-row{
    display:flex; justify-content:space-between; align-items:center;
    font-size:13px; padding:5px 0; border-bottom:1px dashed #2a2e35;
  }
  .tray-row:last-of-type{ border-bottom:none; }
  .tier-dot{ width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:7px; }
  .tray-total{
    display:flex; justify-content:space-between; font-weight:700;
    margin-top:10px; padding-top:8px; border-top:1px solid #30343c; font-size:14.5px;
  }
  .clear-btn{
    margin-top:10px; width:100%; background:transparent; border:1px solid #3a3f48;
    color:var(--muted); padding:7px; border-radius:8px; font-size:12px; cursor:pointer;
  }
  .clear-btn:hover{ color:var(--ink); border-color:var(--gold); }
  .empty-msg{ font-size:12.5px; color:var(--muted); padding:4px 0; }
</style>
</head>
<body>

<header>
  <div class="seal">鮨</div>
  <h1>Menú Kaiten</h1>
  <p>Arrastra la mesa para girar · toca un plato para elegir · toca un platillo para pedirlo</p>
</header>

<section class="view" id="view-wheel">
  <div class="wheel-wrap" id="wheelWrap" tabindex="0"
       aria-label="Mesa giratoria de categorías. Flechas para girar, Enter para elegir el platillo al frente.">
    <div class="wheel-disc"></div>
    <div class="wheel-hub">
      <span class="hub-kanji">鮨</span>
      <span class="hub-text">Gira la mesa<br>para elegir</span>
    </div>
    <div class="wheel-items" id="wheelItems"></div>
  </div>
  <div class="wheel-controls">
    <button class="icon-btn" id="playPauseBtn" type="button">⏸ Pausar giro</button>
    <label class="speed-label">Velocidad
      <span class="speed-tag">Lento</span>
      <input type="range" id="speedSlider" min="0" max="10" value="4" step="1">
      <span class="speed-tag">Rápido</span>
    </label>
  </div>
</section>

<section class="view" id="view-belt" hidden>
  <div class="belt-header">
    <button class="icon-btn" id="backBtn" type="button">← Volver a la mesa</button>
    <h2 id="beltTitle"></h2>
  </div>
  <div class="belt-track-wrap">
    <div class="belt-track" id="beltTrack"></div>
  </div>
</section>

<div class="tray" id="tray">
  <div class="tray-summary" id="traySummary">
    <span id="traySummaryText">🧾 0 platos · $0</span>
    <span class="hint" id="trayHint">ver orden ▾</span>
  </div>
  <div class="tray-details" id="trayDetails" hidden>
    <div id="trayRows"><p class="empty-msg">Aún no has tomado ningún platillo.</p></div>
    <button class="clear-btn" id="clearBtn" type="button">Vaciar orden</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ---------------- Data ---------------- */
  var DATA = {
    entradas: { label:"Entradas", emoji:"🥟", items:[
      ["Edamame",60],["Gyoza de cerdo (6pz)",85],["Sopa miso",45],
      ["Ensalada wakame",55],["Age-dashi tofu",70]
    ]},
    sushi: { label:"Sushi", emoji:"🍣", items:[
      ["Nigiri de salmón",28],["Nigiri de atún",34],["Nigiri de camarón",26],
      ["Nigiri de tamago",22],["Nigiri de anguila",48],["Nigiri de pulpo",38],
      ["Nigiri de toro",68],["Nigiri de erizo (uni)",62]
    ]},
    rolls: { label:"Rolls", emoji:"🍱", items:[
      ["California roll",85],["Roll Philadelphia",92],["Spicy tuna roll",98],
      ["Roll tempura camarón",115],["Roll dragón",128],["Roll rainbow",145],
      ["Roll oro (uni y toro)",175]
    ]},
    ramen: { label:"Ramen", emoji:"🍜", items:[
      ["Ramen shoyu",130],["Ramen miso",140],["Ramen tonkotsu",155],
      ["Ramen vegetariano",118],["Ramen tantanmen",148]
    ]},
    postres: { label:"Postres", emoji:"🍡", items:[
      ["Mochi surtido (3pz)",70],["Dorayaki",65],["Cheesecake matcha",90],
      ["Mochi de sésamo negro",78]
    ]},
    bebidas: { label:"Bebidas", emoji:"🍵", items:[
      ["Té verde",35],["Ramune",50],["Cerveza japonesa",80],
      ["Sake copa",95],["Sake botella",260]
    ]}
  };

  function tierFor(price){
    if(price<=40)  return {name:"verde",   color:"var(--tier-green)"};
    if(price<=80)  return {name:"amarillo",color:"var(--tier-yellow)"};
    if(price<=120) return {name:"rojo",    color:"var(--tier-red)"};
    if(price<=160) return {name:"plata",   color:"var(--tier-silver)"};
    return {name:"oro", color:"var(--tier-gold-bg)"};
  }
  function fmt(n){ return "$" + n.toLocaleString("es-MX"); }

  /* ---------------- Wheel (turntable) ---------------- */
  var wheelWrap = document.getElementById("wheelWrap");
  var wheelItemsEl = document.getElementById("wheelItems");
  var keys = Object.keys(DATA);
  var baseAngle = keys.map(function(_,i){ return -90 + (360/keys.length)*i; });
  var plateEls = [];

  keys.forEach(function(key){
    var b = document.createElement("button");
    b.className = "category-plate";
    b.type = "button";
    b.dataset.key = key;
    b.innerHTML = '<span class="emoji">'+DATA[key].emoji+'</span><span>'+DATA[key].label+'</span>';
    b.addEventListener("click", function(){ selectCategory(key); });
    wheelItemsEl.appendChild(b);
    plateEls.push(b);
  });

  var geo = {cx:0,cy:0,rx:0,ry:0,plateHalf:30};
  function updateGeometry(){
    var r = wheelWrap.getBoundingClientRect();
    geo.cx = r.width/2; geo.cy = r.height/2;
    geo.rx = r.width/2*0.78; geo.ry = r.height/2*0.72;
    if(plateEls[0]) geo.plateHalf = plateEls[0].offsetWidth/2;
  }
  window.addEventListener("resize", updateGeometry);

  var currentAngle = 0, velocity = 0, isDragging = false;
  var dragStartAngle = 0, dragStartCurrentAngle = 0;
  var lastPointerAngle = 0, lastPointerTime = 0;
  var pStartX=0,pStartY=0,pStartTime=0;
  var reducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var isPlaying = !reducedMotion;
  var autoSpeed = 12; // deg/sec

  function pointerAngleDeg(clientX, clientY){
    var r = wheelWrap.getBoundingClientRect();
    var lx = clientX - r.left - geo.cx;
    var ly = clientY - r.top - geo.cy;
    var aspect = (geo.ry||1)/(geo.rx||1);
    var ny = aspect ? ly/aspect : ly;
    return Math.atan2(ny, lx) * 180/Math.PI;
  }

  wheelWrap.addEventListener("pointerdown", function(e){
    updateGeometry();
    isDragging = true;
    velocity = 0;
    wheelWrap.setPointerCapture(e.pointerId);
    dragStartAngle = pointerAngleDeg(e.clientX, e.clientY);
    dragStartCurrentAngle = currentAngle;
    lastPointerAngle = dragStartAngle;
    lastPointerTime = performance.now();
    pStartX = e.clientX; pStartY = e.clientY; pStartTime = Date.now();
  });

  wheelWrap.addEventListener("pointermove", function(e){
    if(!isDragging) return;
    var now = performance.now();
    var ang = pointerAngleDeg(e.clientX, e.clientY);
    var delta = ang - dragStartAngle;
    // normalize delta to avoid jumps across -180/180 boundary
    while(delta > 180) delta -= 360;
    while(delta < -180) delta += 360;
    currentAngle = dragStartCurrentAngle + delta;
    var dt = Math.max(1, now - lastPointerTime);
    var instDelta = ang - lastPointerAngle;
    while(instDelta > 180) instDelta -= 360;
    while(instDelta < -180) instDelta += 360;
    velocity = instDelta / (dt/1000);
    lastPointerAngle = ang;
    lastPointerTime = now;
  });

  function endDrag(e){
    if(!isDragging) return;
    isDragging = false;
    var dist = Math.hypot(e.clientX-pStartX, e.clientY-pStartY);
    var dur = Date.now() - pStartTime;
    if(dist < 6 && dur < 350){
      var el = document.elementFromPoint(e.clientX, e.clientY);
      var plate = el && el.closest ? el.closest(".category-plate") : null;
      if(plate){ velocity = 0; selectCategory(plate.dataset.key); }
    }
  }
  wheelWrap.addEventListener("pointerup", endDrag);
  wheelWrap.addEventListener("pointercancel", endDrag);

  wheelWrap.addEventListener("keydown", function(e){
    if(e.key === "ArrowLeft"){ currentAngle -= 15; velocity = 0; e.preventDefault(); }
    else if(e.key === "ArrowRight"){ currentAngle += 15; velocity = 0; e.preventDefault(); }
    else if(e.key === "Enter" || e.key === " "){
      var frontIdx = 0, best = 1e9;
      keys.forEach(function(k,i){
        var a = ((baseAngle[i]+currentAngle) % 360 + 360) % 360;
        var d = Math.abs(a - 90); d = Math.min(d, 360-d);
        if(d < best){ best = d; frontIdx = i; }
      });
      selectCategory(keys[frontIdx]);
      e.preventDefault();
    }
  });

  var playPauseBtn = document.getElementById("playPauseBtn");
  function syncPlayButton(){
    playPauseBtn.textContent = isPlaying ? "⏸ Pausar giro" : "▶ Reanudar giro";
    syncBeltPlayState();
  }
  playPauseBtn.addEventListener("click", function(){ isPlaying = !isPlaying; syncPlayButton(); });

  var speedSlider = document.getElementById("speedSlider");
  var currentItemCount = 6;
  function applySpeed(){
    var v = Number(speedSlider.value);
    autoSpeed = v * 6;
    var speedMult = 0.4 + v*0.16; // 0.4x lento .. 2.0x rápido (1x en v=4, ritmo por defecto calmado)
    var beltDur = Math.max(4, (currentItemCount * 3.4) / speedMult);
    document.getElementById("beltTrack").style.setProperty("--belt-duration", beltDur+"s");
  }
  speedSlider.addEventListener("input", applySpeed);

  var lastFrame = performance.now();
  function frame(now){
    var dt = Math.min(0.05, (now-lastFrame)/1000);
    lastFrame = now;
    if(isDragging){ /* angle already set on move */ }
    else if(Math.abs(velocity) > 2){
      currentAngle += velocity*dt;
      velocity *= Math.pow(0.05, dt); // fast decay
    } else {
      velocity = 0;
      if(isPlaying) currentAngle += autoSpeed*dt;
    }
    plateEls.forEach(function(el,i){
      var a = (baseAngle[i]+currentAngle) * Math.PI/180;
      var x = geo.cx + geo.rx*Math.cos(a) - geo.plateHalf;
      var y = geo.cy + geo.ry*Math.sin(a) - geo.plateHalf;
      var depth = (Math.sin(a)+1)/2; // 0 back .. 1 front
      var scale = 0.82 + 0.28*depth;
      el.style.transform = "translate("+x+"px,"+y+"px) scale("+scale+")";
      el.style.zIndex = Math.round(depth*100)+1;
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(function(t){ lastFrame=t; updateGeometry(); applySpeed(); syncPlayButton(); requestAnimationFrame(frame); });

  /* ---------------- Belt (conveyor) ---------------- */
  var viewWheel = document.getElementById("view-wheel");
  var viewBelt = document.getElementById("view-belt");
  var beltTrack = document.getElementById("beltTrack");
  var beltTitle = document.getElementById("beltTitle");
  var backBtn = document.getElementById("backBtn");
  var beltWrap = document.querySelector(".belt-track-wrap");
  var hoverPaused = false;
  function syncBeltPlayState(){
    beltTrack.style.animationPlayState = (isPlaying && !hoverPaused) ? "running" : "paused";
  }
  beltWrap.addEventListener("pointerenter", function(){ hoverPaused = true; syncBeltPlayState(); });
  beltWrap.addEventListener("pointerleave", function(){ hoverPaused = false; syncBeltPlayState(); });

  function showView(el){
    el.hidden = false;
    el.classList.add("enter");
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ el.classList.remove("enter"); }); });
  }

  function selectCategory(key){
    var cat = DATA[key];
    if(!cat) return;
    currentItemCount = cat.items.length;
    beltTitle.textContent = cat.emoji + " " + cat.label;
    beltTrack.innerHTML = "";
    var list = cat.items.concat(cat.items); // duplicate for seamless loop
    list.forEach(function(entry){
      var name = entry[0], price = entry[1];
      var tier = tierFor(price);
      var b = document.createElement("button");
      b.type = "button";
      b.className = "belt-item";
      b.innerHTML =
        '<span class="plate-circle" style="background:'+tier.color+'">'+ (cat.emoji) +'</span>' +
        '<span class="item-label"><span class="item-name">'+name+'</span><br>' +
        '<span class="item-price">'+fmt(price)+'</span></span>';
      b.addEventListener("click", function(){
        addToCart(name, price, tier);
        b.classList.remove("taken");
        void b.offsetWidth;
        b.classList.add("taken");
      });
      beltTrack.appendChild(b);
    });
    viewWheel.hidden = true;
    showView(viewBelt);
    applySpeed();
    syncPlayButton();
  }

  backBtn.addEventListener("click", function(){
    viewBelt.hidden = true;
    showView(viewWheel);
  });

  /* ---------------- Order tray ---------------- */
  var cart = {}; // name -> {name, price, tier, qty}
  var traySummaryText = document.getElementById("traySummaryText");
  var trayHint = document.getElementById("trayHint");
  var trayDetails = document.getElementById("trayDetails");
  var trayRows = document.getElementById("trayRows");
  var traySummary = document.getElementById("traySummary");

  function addToCart(name, price, tier){
    if(!cart[name]) cart[name] = {name:name, price:price, tier:tier, qty:0};
    cart[name].qty += 1;
    renderTray();
  }

  function renderTray(){
    var totalQty = 0, totalPrice = 0;
    var names = Object.keys(cart);
    names.forEach(function(n){ totalQty += cart[n].qty; totalPrice += cart[n].qty*cart[n].price; });
    traySummaryText.textContent = "🧾 " + totalQty + (totalQty===1?" plato · ":" platos · ") + fmt(totalPrice);

    if(names.length === 0){
      trayRows.innerHTML = '<p class="empty-msg">Aún no has tomado ningún platillo.</p>';
      return;
    }
    var html = "";
    names.forEach(function(n){
      var it = cart[n];
      html += '<div class="tray-row"><span><span class="tier-dot" style="background:'+it.tier.color+'"></span>' +
              it.name + ' × ' + it.qty + '</span><span>' + fmt(it.price*it.qty) + '</span></div>';
    });
    html += '<div class="tray-total"><span>Total</span><span>' + fmt(totalPrice) + '</span></div>';
    trayRows.innerHTML = html;
  }

  traySummary.addEventListener("click", function(){
    var open = !trayDetails.hidden;
    trayDetails.hidden = open;
    trayHint.textContent = open ? "ver orden ▾" : "ocultar ▴";
  });

  document.getElementById("clearBtn").addEventListener("click", function(e){
    e.stopPropagation();
    cart = {};
    renderTray();
  });

  renderTray();
})();
</script>
</body>
</html>
